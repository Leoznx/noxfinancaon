services:
  credpago-worker:
    build: .
    image: nox-automacao-credpago:latest
    container_name: nox-automacao-credpago
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      # Sessão portátil dentro do container — ver ./data/README (montado abaixo).
      CREDPAGO_STORAGE_STATE_PATH: /app/data/credpago-session.json
      # Sobrescreve um eventual valor legado ainda presente no .env da VPS.
      CREDPAGO_URL: https://app.loft.com.br/erp/proposta/analise-de-credito
      HEADLESS: "true"
      # O deploy informa o commit atual; o fallback preserva instalações antigas.
      AUTOMATION_VERSION: "${AUTOMATION_VERSION:-unknown}"
      DEPLOY_VERSION: "${DEPLOY_VERSION:-unknown}"
      # Evita que um valor legado de 5s no .env atrase cada nova simulacao.
      AUTOMATION_POLL_INTERVAL_MS: "1500"
      CREDIT_PROVIDER_CREDENTIAL_KEY: "${CREDIT_PROVIDER_CREDENTIAL_KEY:-loft-primary}"
      CREDIT_HEARTBEAT_INTERVAL_MS: "${CREDIT_HEARTBEAT_INTERVAL_MS:-15000}"
      # O cancelador compartilha a sessão autenticada do Chromium e é parte da
      # prontidão operacional do worker.
      LOFT_CANCELLATION_ENABLED: "${LOFT_CANCELLATION_ENABLED:-true}"
      LOFT_CANCELLATION_REQUIRED: "${LOFT_CANCELLATION_REQUIRED:-true}"
      LOFT_CANCELLATION_MODE: "${LOFT_CANCELLATION_MODE:-portal}"
      LOFT_CANCELLATION_VALIDATION_TIMEOUT_MS: "${LOFT_CANCELLATION_VALIDATION_TIMEOUT_MS:-120000}"
      LOFT_CANCELLATION_OPERATION_TIMEOUT_MS: "${LOFT_CANCELLATION_OPERATION_TIMEOUT_MS:-240000}"
      HEALTH_PORT: "3000"
      REPAIR_HEALTH_PORT: "3001"
      # A API de análise da Loft pode levar vários minutos em horário de pico.
      # Estes valores sobrescrevem limites legados que possam permanecer no .env da VPS.
      CONSULTA_TIMEOUT_MS: "420000"
      QUEUE_METRICS_INTERVAL_MS: "${QUEUE_METRICS_INTERVAL_MS:-60000}"
    volumes:
      # Só o arquivo de sessão (poucos KB) fica persistido no host — nunca o
      # perfil completo do Chrome. Gerado localmente por
      # `npm run automation:export-session` e copiado pra cá via scp/rsync.
      - ./data:/app/data
    # Só acessível localmente na própria VPS — o Nginx (rodando no host, fora
    # deste compose) é quem expõe isso publicamente em
    # https://automacao.noxfianca.com, via proxy reverso.
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    shm_size: "2gb" # Chromium precisa de /dev/shm maior que o padrão de 64MB do Docker.
    deploy:
      resources:
        limits:
          # O limite mantém margem para o Chromium e para a recuperação automática.
          # As análises são serializadas porque o portal compartilha estado por sessão.
          memory: 4g
        reservations:
          memory: 1g
    healthcheck:
      # Verifica os dois processos do supervisor. /health mede liveness do worker
      # de crédito sem reiniciar o container por indisponibilidade externa.
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all([fetch('http://127.0.0.1:3000/health'),fetch('http://127.0.0.1:3001/live')]).then(rs=>process.exit(rs.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
